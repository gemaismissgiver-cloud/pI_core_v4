name: Android APK bauen
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev
          pip install buildozer cython

      - name: Android-SDK-Lizenzen annehmen
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk
          export ANDROID_HOME=~/.buildozer/android/platform/android-sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: APK bauen
        run: buildozer android debug

      - name: APK als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" bin/*.apk --title "PI v4 $TAG" --notes "Direkte APK-Datei"
