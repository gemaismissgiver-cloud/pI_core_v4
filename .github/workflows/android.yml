[app]
title = PI v4
package.name = piv4
package.domain = de.pi
source.dir = .
source.include_exts = py,json,png,jpg,ttf,kv
version = 1.0
requirements = python3,kivy==2.3.0,pyjnius
orientation = portrait
fullscreen = 0
android.permissions = INTERNET
android.api = 34
android.minapi = 26
android.archs = arm64-v8a
android.ndk = 27c
android.accept_sdk_license = True
android.gradle_build_options = --warning-mode=all

[buildozer]
log_level = 2
warn_on_root = 1
p4a.branch = develop 
