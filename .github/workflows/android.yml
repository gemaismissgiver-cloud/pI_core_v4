name: Android APK bauen
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev ffmpeg
          pip install buildozer cython

      - name: Buildozer und Android SDK vorbereiten
        run: |
          # Akzeptiert die Android-Lizenzen automatisch im Voraus
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          # Führt den Build im nicht-interaktiven Modus aus
          # Falls keine buildozer.spec existiert, erstelle eine Standard-Datei
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi

      - name: APK bauen
        run: |
          # yes | erzwingt die automatische Zustimmung für alle SDK-Downloads
          yes | buildozer -v android debug

      - name: APK als Release veröffentlichen
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" bin/*.apk --title "PI v4 $TAG" --notes "Direkte APK-Datei"
